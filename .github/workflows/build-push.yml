# =====================================================================
#  Build & Push – Varnish Hardened
#  Multi-stage Dockerfile → ghcr.io + Docker Hub
#  Lint + Build + Sign (cosign OIDC) + Scan (Trivy) + Release
# =====================================================================
name: build-push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Dockerfile'
      - 'init.go'
      - 'init_test.go'
      - 'go.mod'
      - 'conf/**'
      - 'scripts/**'
      # versions.json drives the build-args and the tag; docker-compose.yml and
      # the Makefile drive the functional-test job. Leaving them out meant a
      # change to any of them shipped without ever being built or tested.
      - 'versions.json'
      - 'docker-compose.yml'
      - 'Makefile'
      - 'image.manifest'
      - '.github/workflows/build-push.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: varnish-hardened

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
  attestations: write

jobs:
  # -------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts

      # Six depots publics et autonomes portent les MEMES scripts, dupliques
      # parce qu'ils ne peuvent pas se referencer. Rien ne les tenait alignes
      # que la discipline. Un correctif applique dans un seul depot passerait
      # inapercu jusqu'au jour ou deux CI ne testent plus la meme chose.
      # Ici on refuse une edition locale d'un script partage : toucher le
      # fichier oblige a toucher la reference, donc a le voir dans le diff de
      # la PR. La divergence ENTRE depots se voit avec
      # opencode-profile/scripts/check-vendored-sync.sh, qui a les six clones.
      - name: Vendored scripts unchanged
        run: sha256sum -c scripts/VENDORED.sha256

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          set -euo pipefail
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # -------------------------------------------------------------------
  #  Builds the image once. On a real push/tag (never on pull_request --
  #  fork PRs must not get registry credentials) it's pushed BY DIGEST, so
  #  `test` below can pull back that exact digest and run the functional
  #  tests against those literal bytes -- not a separately-built image that
  #  "should" match thanks to cache. `promote` re-tags/signs/scans that
  #  same digest; nothing gets rebuilt between "tested" and "shipped". On a
  #  PR there's no registry to push to, so the image is instead exported to
  #  a local tarball and handed to `test` (a separate job/runner) as an
  #  artifact.
  # -------------------------------------------------------------------
  build:
    name: Build image
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Varnish version
        id: versions
        run: |
          set -euo pipefail
          VARNISH_VER=$(jq -r '.varnish' versions.json)
          VARNISH_SHA=$(jq -r '.varnish_sha256' versions.json)
          ALPINE_VER=$(jq -r '.alpine' versions.json)
          test -n "$VARNISH_SHA" -a "$VARNISH_SHA" != "null" \
            || { echo "versions.json has no .varnish_sha256 -- the build would have no integrity check" >&2; exit 1; }
          echo "varnish=${VARNISH_VER}" >> "$GITHUB_OUTPUT"
          echo "varnish_sha256=${VARNISH_SHA}" >> "$GITHUB_OUTPUT"
          echo "alpine=${ALPINE_VER}" >> "$GITHUB_OUTPUT"

      - name: Make room for local tarball export (PR only)
        if: env.PUBLISH != 'true'
        run: mkdir -p /tmp/image-tar

      - name: Build (push-by-digest, or local tarball on PR)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.NAMESPACE, env.IMAGE_NAME) || 'type=docker,dest=/tmp/image-tar/image.tar' }}
          tags: ${{ env.PUBLISH != 'true' && format('localhost/{0}:latest', env.IMAGE_NAME) || '' }}
          sbom: ${{ env.PUBLISH }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          build-args: |
            VARNISH_VERSION=${{ steps.versions.outputs.varnish }}
            VARNISH_SHA256=${{ steps.versions.outputs.varnish_sha256 }}
            ALPINE_VERSION=${{ steps.versions.outputs.alpine }}
          cache-from: type=gha,scope=varnish
          cache-to: type=gha,mode=max,scope=varnish
          # Le stage `prep` porte les paquets Alpine qui finissent dans
          # l'image. Le servir depuis le cache GHA rend deux controles
          # menteurs a la fois : le manifeste compare l'image a une reference
          # generee sur un build frais (varnish a sorti libpcre2 0.15.0 depuis
          # son cache pendant que squid sortait 0.16.0 du sien, le meme jour),
          # et le scan CVE du meme stage examine des paquets perimes. Un
          # controle dont le resultat depend de l'age d'un cache invisible ne
          # controle rien. Le cout est un `apk add` par build.
          no-cache-filters: prep

      # Le stage `prep` est la seule Alpine qui reste lisible par un scanner :
      # il contient exactement les paquets runtime qui seront copies dans
      # l'image finale `FROM scratch`, ou plus aucun scanner ne saura dire de
      # quel paquet vient un fichier. Viser `builder` scannerait la chaine de
      # compilation, qui n'entre dans aucune image.
      #
      # Deux comportements dans la meme etape, volontairement dissocies :
      # le SARIF remonte CRITICAL+HIGH pour que tout soit visible dans
      # l'onglet Security ; l'echec est reserve aux CRITICAL *corrigeables*
      # en amont (`ignore-unfixed`), pour qu'un job rouge veuille toujours
      # dire « un upgrade du stage prep corrige une faille critique » --
      # jamais « Alpine a publie un avis et on ne peut rien y faire ».
      - name: Build prep stage (Alpine with runtime deps)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prep
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}-prep:scan
          no-cache-filters: prep
          build-args: |
            VARNISH_VERSION=${{ steps.versions.outputs.varnish }}
            VARNISH_SHA256=${{ steps.versions.outputs.varnish_sha256 }}
            ALPINE_VERSION=${{ steps.versions.outputs.alpine }}
          cache-from: type=gha,scope=varnish

      - name: Trivy scan prep stage (report CRITICAL+HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-prep:scan
          format: sarif
          output: trivy-prep.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload prep SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-prep.sarif
          category: ${{ env.IMAGE_NAME }}-deps

      - name: Trivy gate prep stage (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-prep:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload image tarball (PR only, for the test job)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-tar
          path: /tmp/image-tar/image.tar
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------------
  #  Loads the exact bytes `build` just produced (pulled by digest from
  #  the registry, or loaded from its tarball artifact on a PR) and runs
  #  the functional tests against them.
  # -------------------------------------------------------------------
  test:
    name: Functional tests
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Login ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built digest for testing
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          docker pull "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
          docker tag  "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}" "localhost/${{ env.IMAGE_NAME }}:latest"

      - name: Download image tarball (PR only)
        if: env.PUBLISH != 'true'
        uses: actions/download-artifact@v8
        with:
          name: image-tar
          path: /tmp/image-tar

      - name: Load image tarball (PR only)
        if: env.PUBLISH != 'true'
        run: docker load -i /tmp/image-tar/image.tar

      - name: Build & start stack
        run: docker compose up -d --no-build varnish

      - name: Wait for healthy
        run: |
          set -euo pipefail
          cid="$(docker compose ps -q varnish)"
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "::error::varnish did not become healthy in time"
          docker inspect --format '{{json .State.Health}}' "$cid" || true
          docker compose logs
          exit 1

      # A version tag that does not match the binary inside is the one
      # failure nothing else here catches: php shipped 8.5.8 under an 8.5.9
      # tag for 18 days because only the FROM tag was rewritten, never the
      # digest. Ask the built image what it is, and refuse to publish if it
      # disagrees with what we are about to call it.
      - name: Assert the image is the Varnish version we tag it with
        run: |
          set -euo pipefail
          want=$(jq -r .varnish versions.json)
          # Capture the probe before extracting: a dead container or a
          # changed banner would otherwise fail the pipeline under
          # `set -e` before a single diagnostic line is printed.
          raw=$(docker exec "$(docker compose ps -q varnish)" varnishd -V 2>&1 || true)
          got=$(printf '%s' "$raw" | grep -oP 'varnish-\K[0-9][0-9.]*' || true)
          echo "declared: ${want} | image: ${got:-<no version parsed>}"
          if [ "$want" != "$got" ]; then
            echo "::error::image ships Varnish ${got:-<unknown>} but would be published as ${want}"
            printf 'probe output:\n%s\n' "$raw" | head -5
            exit 1
          fi

      # Le manifeste dit ce qui est DANS l'image : chemins, modes, uid/gid,
      # capabilities de fichier, et doublons de contenu. Rien d'autre dans
      # cette chaine ne regarde ca -- hadolint lit le Dockerfile (il verifie
      # qu'une ligne existe, pas qu'elle a marche), et Trivy ne parle que de
      # paquets, dont une image FROM scratch n'a plus aucun. Toute derive
      # echoue ici ; si elle est voulue, regenerer le manifeste DANS LE MEME
      # COMMIT -- c'est le diff qu'on relit dans la PR.
      - name: Image manifest
        run: ./scripts/image-manifest.py --check localhost/varnish-hardened:latest -m image.manifest

      # `lddtree` signale une dependance introuvable sur stderr et sort quand
      # meme en 0 : un build peut donc publier une image `FROM scratch` a
      # laquelle il manque une bibliotheque, l'erreur ne sortant qu'au
      # demarrage du conteneur, en production. Constate le 2026-08-28 sur
      # clamav-hardened (libbz2.so.1) et suricata (dix modules Python). Ici on
      # demande au vrai chargeur musl, dans un chroot sur le filesystem de
      # l'image, de resoudre chaque ELF embarque.
      - name: Image closure
        run: ./scripts/check-image-closure.sh localhost/varnish-hardened:latest

      - name: Run smoke tests
        run: ./scripts/test.sh 127.0.0.1 8080

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------------
  #  Re-tags the exact digest `build` pushed and `test` just verified --
  #  no rebuild. imagetools create also copies it to Docker Hub when
  #  configured (cross-registry manifest copy, no local pull needed).
  # -------------------------------------------------------------------
  promote:
    name: Promote tested digest
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}

    steps:
      # fetch-depth 0: build-revision.sh counts commits, a shallow clone
      # would silently make every build .0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Varnish version
        id: versions
        run: |
          set -euo pipefail
          VARNISH_VER=$(jq -r '.varnish' versions.json)
          echo "varnish=${VARNISH_VER}" >> "$GITHUB_OUTPUT"
          echo "### Resolved versions" >> "$GITHUB_STEP_SUMMARY"
          echo "- varnish: ${VARNISH_VER}" >> "$GITHUB_STEP_SUMMARY"

      - name: Compute Docker Hub image name
        id: dockerhub-image
        if: steps.dockerhub.outputs.available == 'true'
        env:
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "image=docker.io/${DOCKERHUB_NS}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Compute build revision
        id: revision
        run: |
          set -euo pipefail
          VERSION="${{ steps.versions.outputs.varnish }}"
          REVISION=$(./scripts/build-revision.sh varnish Dockerfile init.go go.mod conf/ scripts/ versions.json)
          echo "tag=${VERSION}.${REVISION}" >> "$GITHUB_OUTPUT"
          echo "- Build revision: ${VERSION}.${REVISION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub-image.outputs.image }}
          tags: |
            type=raw,value=${{ steps.revision.outputs.tag }}
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.versions.outputs.varnish }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create tags on the tested digest (no rebuild)
        id: manifest
        run: |
          set -euo pipefail
          SOURCE="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
          TAGS=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAGS="${TAGS} -t ${tag}"
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create ${TAGS} "${SOURCE}"
          DIGEST=$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.varnish }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (OIDC keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          HAS_DOCKERHUB: ${{ steps.dockerhub.outputs.available }}
          DOCKERHUB_NS: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            COSIGN_REPOSITORY="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}" \
              cosign sign --yes "docker.io/${DOCKERHUB_NS}/${{ env.IMAGE_NAME }}@${DIGEST}"
          fi

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}
          format: sarif
          output: trivy-varnish.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-varnish.sarif
          category: varnish-hardened

      - name: GitHub SLSA Attestation
        if: "!startsWith(github.ref, 'refs/heads/dependabot/')"
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # -------------------------------------------------------------------
  # -------------------------------------------------------------------
  #  Le README nomme le tag immuable courant. On le regenere ici pour que la
  #  doc ne puisse jamais designer un tag que les registres ne portent plus.
  # -------------------------------------------------------------------
  update-readme:
    name: Refresh README tag block
    needs: promote
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth 0: build-revision.sh counts commits, a shallow clone
      # would silently make every image .0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rewrite tag block
        run: |
          set -euo pipefail
          VERSION=$(jq -r .varnish versions.json)
          REVISION=$(./scripts/build-revision.sh varnish Dockerfile init.go go.mod conf/ scripts/ versions.json)
          ./scripts/update-readme-tags.sh "jbsky/varnish-hardened=${VERSION}=${VERSION}.${REVISION}"

      - name: Commit if changed
        run: |
          set -euo pipefail
          # `git diff --quiet && exit 0` would abort the step under `set -e`
          # on the branch where there IS a change: use an explicit if.
          if git diff --quiet README.md; then
            echo "README already names the current tag"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): tag immuable courant [skip ci]"
          # A concurrent publish may have landed first: rebase and retry
          # rather than fail the run over a race.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main || true
          done
          exit 1

  cleanup:
    name: Prune old registry tags
    needs: promote
    uses: ./.github/workflows/registry-cleanup.yml
    secrets: inherit

  # -------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: promote
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tarball + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          tar --exclude='.git' --exclude='dist' \
              -czf "dist/varnish-hardened-${VERSION}.tar.gz" \
              --transform "s,^,varnish-hardened-${VERSION}/," \
              $(ls -A | grep -v -E '^(\.git|dist)$')
          cd dist
          sha256sum "varnish-hardened-${VERSION}.tar.gz" > "varnish-hardened-${VERSION}.sha256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/varnish-hardened-${{ github.ref_name }}.tar.gz
            dist/varnish-hardened-${{ github.ref_name }}.sha256
